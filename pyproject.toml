[project]
name = "qwen"
version = "0.1.0"
description = "Ollama generation latency and NVIDIA GPU benchmark"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.3",
]

[project.scripts]
qwen = "qwen:main"
qwen-bench = "qwen.bench:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
